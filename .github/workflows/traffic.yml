name: Traffic stats

# GitHub only keeps repository traffic (views and clones) for a rolling 14 days.
# This job snapshots it daily and appends to docs/traffic/ so a long-term record
# survives beyond that window.
#
# views.csv and clones.csv are per-day. referrers.csv and popular_paths.csv are different: GitHub gives
# those only as a trailing-14-day total, so each row is that total as of the snapshot date (see
# .github/scripts/traffic_ranked.py). The difference between snapshots is the net change in a rolling total
# (new visits minus visits leaving the window), so use it for trends and new sources, not exact daily counts.

on:
  schedule:
    # 06:10 UTC daily. Cron on GitHub is best-effort and may run late; the merge
    # is by date, so a missed or repeated run does not corrupt the history.
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The built-in GITHUB_TOKEN cannot read the traffic API (it needs the
      # Administration permission, which that token is never granted). A
      # fine-grained PAT with Administration: Read and Contents: Read & Write,
      # stored as the TRAFFIC_TOKEN secret, is required. If it is absent the job
      # skips cleanly rather than failing every day.
      - name: Check for the traffic token
        id: token
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "${TRAFFIC_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TRAFFIC_TOKEN secret is not set; skipping the traffic snapshot. See .github/workflows/traffic.yml."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch traffic and merge into the CSVs
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p docs/traffic

          # $1 = api sub-path (views|clones), $2 = output csv
          merge() {
            local kind="$1" out="docs/traffic/$2"
            gh api "repos/$REPO/traffic/$kind" > "resp.json"
            [ -f "$out" ] || echo "date,count,uniques" > "$out"
            python3 - "$out" <<'PY'
          import csv, json, sys
          out = sys.argv[1]
          data = json.load(open("resp.json"))
          # Bucket key differs: views -> "views", clones -> "clones".
          buckets = data.get("views") or data.get("clones") or []
          rows = {}
          try:
              with open(out, newline="") as f:
                  r = csv.reader(f)
                  next(r, None)  # header
                  for row in r:
                      if len(row) >= 3:
                          rows[row[0]] = (row[1], row[2])
          except FileNotFoundError:
              pass
          for b in buckets:
              # timestamp is an ISO day like 2026-11-05T00:00:00Z -> keep the date
              day = b["timestamp"][:10]
              rows[day] = (str(b["count"]), str(b["uniques"]))
          with open(out, "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["date", "count", "uniques"])
              for day in sorted(rows):
                  w.writerow([day, rows[day][0], rows[day][1]])
          PY
            rm -f resp.json
          }

          merge views views.csv
          merge clones clones.csv

          # Referrers and popular paths: 14-day totals, recorded once per snapshot date.
          snapshot="$(date -u +%F)"
          gh api "repos/$REPO/traffic/popular/referrers" > resp.json
          python3 .github/scripts/traffic_ranked.py resp.json docs/traffic/referrers.csv referrer "$snapshot"
          gh api "repos/$REPO/traffic/popular/paths" > resp.json
          python3 .github/scripts/traffic_ranked.py resp.json docs/traffic/popular_paths.csv path "$snapshot"
          rm -f resp.json

      - name: Commit any changes
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/traffic/views.csv docs/traffic/clones.csv docs/traffic/referrers.csv docs/traffic/popular_paths.csv
          if git diff --cached --quiet; then
            echo "No traffic changes to record."
          else
            git commit -m "Update traffic stats [skip ci]"
            git push
          fi
