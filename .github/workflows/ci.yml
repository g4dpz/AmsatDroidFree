name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use GitHub's standard Actions cache, not v6's default proprietary enhanced caching
          # (which carries separate Gradle Terms of Use).
          cache-provider: basic

      # The wrapper downloads the Gradle distribution from GitHub, which occasionally answers 504 and fails the
      # whole run before any code is built. Fetch it on its own with a few retries; only this download is retried,
      # so a genuine build, test or lint failure still fails straight away.
      - name: Fetch the Gradle distribution (retries on a flaky download)
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $attempt of 4); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Could not download the Gradle distribution after 4 attempts"
          exit 1
      # Dependencies such as the Kotlin compiler jar are also fetched from GitHub-hosted downloads, which time out
      # during GitHub incidents and fail the build before any code is compiled. Retry the build, but only when the log
      # shows a network failure; a compile error, test failure or lint finding fails at once, without a retry.
      - name: Assemble, unit test, lint and cover (retries only on network errors)
        run: |
          set +e  # a failed build must not end the script before the status is checked
          log="$RUNNER_TEMP/gradle-build.log"
          network_error='Could not (download|GET)|Read timed out|Connect timed out|Connection reset|HTTP response code: 5|status code 5'
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
              :app:koverHtmlReportDebug :app:koverXmlReportDebug 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -qE "$network_error" "$log"; then
              echo "Build failed (exit $status) with no network error in the log; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::Build failed on a network error (attempt $attempt of $attempts); retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Build still failing on network errors after $attempts attempts"
          exit "$status"

      # Show the unit-test coverage on the run's summary page; the HTML report is in the artifact below.
      - name: Coverage summary
        run: python3 .github/scripts/coverage-summary.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"
      # Make the built debug APK downloadable from the run. This is debug-signed, for testing and
      # sideloading only — not a Play Store release (that needs a signed AAB; see the signing config).
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the reports even when a step fails, so failures can be diagnosed from the run.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/kover/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
