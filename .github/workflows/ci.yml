name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use GitHub's standard Actions cache, not v6's default proprietary enhanced caching
          # (which carries separate Gradle Terms of Use).
          cache-provider: basic

      - name: Assemble, unit test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # Make the built debug APK downloadable from the run. This is debug-signed, for testing and
      # sideloading only — not a Play Store release (that needs a signed AAB; see the signing config).
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the reports even when a step fails, so failures can be diagnosed from the run.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
